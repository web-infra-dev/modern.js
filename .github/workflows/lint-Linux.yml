name: Lint(Ubuntu)

concurrency:
  group: ubuntu-lint-${{ github.head_ref }}
  cancel-in-progress: true

# Controls when the action will run.
on:
  # Triggers the workflow on pull request events but only for the main branch
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

  merge_group:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  lint-linux:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Checkout
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
        with:
          # Include both comparison trees, including PR and merge queue parents.
          fetch-depth: 0

      - name: Install Pnpm
        run: npm i -g --force corepack && corepack enable

      - name: Setup Node.js 22
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --ignore-scripts

      - name: Lint package.json
        run: pnpm run lint:package-json

      - name: Check Source Dependencies
        run: pnpm run check-source-dependencies

      - name: Check Test Governance
        env:
          TEST_GOVERNANCE_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          # PRs use the checked-out merge candidate, including the current base policy.
          TEST_GOVERNANCE_HEAD: ${{ github.event.merge_group.head_sha || github.sha }}
          TEST_GOVERNANCE_EVENT: ${{ github.event_name }}
          TEST_GOVERNANCE_PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          base="$TEST_GOVERNANCE_BASE"
          if [ -z "$base" ]; then
            base="$(git rev-parse "${TEST_GOVERNANCE_HEAD}^")"
          fi
          if [ "$TEST_GOVERNANCE_EVENT" = "pull_request" ]; then
            pnpm check-test-governance --base "$base" --head "$TEST_GOVERNANCE_HEAD" --require-approval
          else
            pnpm check-test-governance --base "$base" --head "$TEST_GOVERNANCE_HEAD"
          fi

      - name: Check Lint and Formatting
        run: pnpm run check

      - name: Check Changeset
        run: pnpm run check-changeset
